# i prefer Ctrl-o instead of the default Ctrl-b
unbind C-b
set -g prefix C-o
setw -g mode-keys vi
# use the spacebar to switch windows
unbind Space
bind Space next-window
# change split-window bindings
unbind %
unbind '"'
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
set -g mouse on
# sane scrolling:
#bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e; send-keys -M'"
# disable esc-wait
set-option -sg  escape-time 0

set-option -g   history-limit 500000

set -g default-terminal "tmux-256color"

bind-key o send-prefix

# hardstatus line theme — vim-airline style, keeping the green-on-black
# scheme with the cyan/red window accents. Separators are powerline
# triangles and the pills carry Nerd Font glyphs — same font the vim
# statusline and trueline already use:
#     U+E0B0  filled triangle (segment boundary)
#     U+F109  laptop          (hostname)
#     U+F0E4  gauge           (load average)
#     U+F017  clock           (time)
#     U+F073  calendar        (date)
set-option -g status-fg white
set-option -g status-bg black
set-option -g status-justify centre

# Left: hostname badge, airline "mode badge" style
set-option -g status-left-length 60
set-option -g status-left '#[fg=green,bg=black]#[fg=black,bg=green,bold] #h #[fg=green,bg=black]'

# Right: three pills — loadavg white-on-grey, time black-on-cyan, date
# black-on-green. tmux expands % strftime formats itself, so unlike the
# old #(/bin/date ...) calls this spawns no subprocesses.
set-option -g status-right-length 80
set-option -g status-right '#[fg=colour8,bg=black]#[fg=white,bg=colour8] #($HOME/bin/loadavg) #[fg=colour8,bg=cyan]#[fg=black,bg=cyan] %l:%M%p #[fg=cyan,bg=green]#[fg=black,bg=green,bold] %m/%d/%y #[fg=green,bg=black]'

# Inactive windows: unchanged — dim cyan index, white name
set-window-option -g window-status-format '#[fg=cyan,dim]#I#[fg=white]:#[default]#W#[fg=colour8,dim]#F'

# Active window: red powerline pill instead of a red (...)
set-window-option -g window-status-current-format '#[fg=red,bg=black]#[fg=black,bg=red,bold]#I:#W#F #[fg=red,bg=black]'

