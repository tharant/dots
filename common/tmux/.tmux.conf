# i prefer Ctrl-o instead of the default Ctrl-b
unbind C-b
set -g prefix C-o
setw -g mode-keys vi
# use the spacebar to switch windows
unbind Space
bind Space next-window
# change split-window bindings
unbind %
unbind '"'
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
set -g mouse on
# sane scrolling:
#bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e; send-keys -M'"
# disable esc-wait
set-option -sg  escape-time 0

set-option -g   history-limit 500000

set -g default-terminal "tmux-256color"

# OSC 52 clipboard: let the outer terminal own the clipboard rather than
# tmux caching it internally, and pass arbitrary escape sequences through
# (needed by ~/bin/tmux-copy's OSC 52 fallback over ssh).
set -s set-clipboard external
set -g allow-passthrough on

# 24-bit colour, but only for terminals that actually advertise 256
# colours — a blanket `,*:RGB` lie breaks terminals that genuinely can't
# do truecolor.
set-option -sa terminal-features ',xterm-256color:RGB,tmux-256color:RGB,screen-256color:RGB,*-256color:RGB'

bind-key o send-prefix

# Copy mode: yank goes to the OS clipboard via ~/bin/tmux-copy (pbcopy /
# clip.exe / wl-copy / xclip, OSC 52 fallback). Enter keeps its usual
# copy-and-exit feel while routing through the same shim.
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "tmux-copy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "tmux-copy"

# hardstatus line theme — vim-airline style, keeping the green-on-black
# scheme with the cyan/red window accents. Separators are powerline
# triangles and the pills carry Nerd Font glyphs — same font the vim
# statusline and trueline already use:
#     U+E0B0  filled triangle (segment boundary)
#     U+F109  laptop          (hostname)
#     U+F0E4  gauge           (load average)
#     U+F017  clock           (time)
#     U+F073  calendar        (date)
set-option -g status-fg white
set-option -g status-bg black
set-option -g status-justify centre

# Left: hostname badge — dark grey pill, white label
set-option -g status-left-length 60
set-option -g status-left '#[fg=white,bg=colour8,bold]  #h #[fg=colour8,bg=black] '

# Right: airline-style flow — dark grey (loadavg), light grey (time),
# truecolor light blue (date); white labels. Each pill leads with a
# left-pointing tip in its own colour, and the line tapers out to the
# right at the final cap (date>), mirroring the vim statusline.
# Leading caps are  (apex left), trailing caps  (apex right).
# tmux expands % strftime formats itself, so no subprocesses here.
set-option -g status-right-length 100
set-option -g status-right '#[fg=colour8,bg=black]#[fg=white,bg=colour8]  #($HOME/bin/loadavg) #[fg=colour245,bg=colour8]#[fg=white,bg=colour245]  %l:%M%p #[fg=#4a90e2,bg=colour245]#[fg=white,bg=#4a90e2]  %m/%d/%y #[fg=#4a90e2,bg=black]'
# Windows as a centre flow: each pill is white-label on its own grey and
# tapers out with a right-pointing cap plus a black gap, so the list
# reads pane1> pane2>. Active: light grey pill, bold. Inactive: dark grey.
set-window-option -g window-status-format '#[fg=white,bg=colour8]#I:#W#F#[fg=colour8,bg=black]'
set-window-option -g window-status-current-format '#[fg=white,bg=colour245,bold]#I:#W#F#[fg=colour245,bg=black]'

# Cold-start convenience: auto-create "main" when the server boots with
# no sessions, so reconnecting with `ssh host -t tmux -2 at` always has
# something to attach to. `tmux new -A -s main` converges on the same
# session. Note: re-sourcing this file against a running server prints
# a harmless "duplicate session: main" warning and creates nothing.
new-session -d -s main

