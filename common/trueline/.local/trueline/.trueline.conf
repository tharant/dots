TRUELINE_GIT_SHOW_STATUS_NUMBERS=true
TRUELINE_WORKING_DIR_SPACE_BETWEEN_PATH_SEPARATOR=false
TRUELINE_WORKING_DIR_ABBREVIATE_PARENT_DIRS=false
TRUELINE_WORKING_DIR_ABBREVIATE_PARENT_DIRS_LENGTH=3
TRUELINE_GIT_MODIFIED_COLOR='bright_pink'
TRUELINE_GIT_UNTRACKED_COLOR='orange'
TRUELINE_GIT_STASHED_COLOR='light_blue'
TRUELINE_GIT_BEHIND_AHEAD_COLOR='bright_green'
TRUELINE_GIT_STAGED_COLOR='bright_green'
TRUELINE_USER_ROOT_COLORS=('black' 'orange')
TRUELINE_USER_SHOW_IP_SSH=true

_trueline_time_segment() {
    # printf %(fmt)T (bash >= 4.2) avoids spawning `date` on every prompt
    local prompt_time
    printf -v prompt_time '%(%Y%m%d %H:%M:%S)T' -1
    if [[ -n "$prompt_time" ]]; then
        local fg_color="$1"
        local bg_color="$2"
        local font_style="$3"
        local segment="$(_trueline_separator)"
        segment+="$(_trueline_content "$fg_color" "$bg_color" "$font_style" "$prompt_time ")"
        PS1+="$segment"
        _trueline_record_colors "$fg_color" "$bg_color" "$font_style"
    fi
}

_trueline_kubernetes_segment() {
    if [[ -n ${USING_KUBECONFIG} ]]; then
      # Read the context straight from the kubeconfig file(s) instead of
      # spawning kubectl, which takes a few hundred ms per prompt
      local some_content='' line f
      local -a kc_files
      IFS=':' read -r -a kc_files <<< "${KUBECONFIG:-$HOME/.kube/config}"
      for f in "${kc_files[@]}"; do
        [[ -r "$f" ]] || continue
        line="$(grep -m1 '^current-context:' "$f" 2>/dev/null)" || continue
        some_content="${line#*:}"
        some_content="${some_content//\"/}"
        some_content="${some_content// /}"
        break
      done
      if [[ -n "$some_content" ]]; then
        local fg_color="$1"
        local bg_color="$2"
        local font_style="$3"
        local segment="$(_trueline_separator)"
        segment+="$(_trueline_content "$fg_color" "$bg_color" "$font_style" " ${TRUELINE_SYMBOLS[kubernetes]}$some_content")"
        PS1+="$segment"
        _trueline_record_colors "$fg_color" "$bg_color" "$font_style"
      fi
    fi
}

source "${HOME}/.local/trueline/trueline.sh"
